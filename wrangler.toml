name = "cloudflare-hexo-comments"
main = "src/index.js"
compatibility_date = "2026-11-20"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hexo-comments"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Comma-separated blog origins, without paths. Example: "https://example.com,https://www.example.com"
ALLOWED_ORIGINS = ""
