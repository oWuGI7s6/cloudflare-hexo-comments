<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>评论管理 · Cloudflare Hexo Comments</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b3c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:1000px;margin:auto}.panel{background:#fff;border:1px solid #e8ecf3;border-radius:16px;padding:24px;box-shadow:0 8px 32px #263b5910}h1{font-size:1.5rem;margin:0 0 6px}.muted{color:#7b879a}.login{max-width:400px;margin:8vh auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.login form{display:grid;gap:12px;margin-top:20px}input{width:100%;padding:12px;border:1px solid #dce2ec;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:10px 15px;background:#5b7cfa;color:white;font:inherit;cursor:pointer}button.secondary{background:#eef1f7;color:#364259}button.danger{background:#fff0f0;color:#c53939;padding:7px 10px}.error{color:#bd3434;min-height:1.4em}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f5;vertical-align:top}th{font-size:.86rem;color:#78849a}td.content{white-space:pre-wrap;overflow-wrap:anywhere;min-width:220px}.path{max-width:210px;overflow-wrap:anywhere;color:#59677e;font-size:.88rem}.small{font-size:.82rem}.hidden{display:none}@media(max-width:700px){body{padding:18px 10px}.panel{padding:17px;overflow:auto}th,td{padding:10px 7px}.path{max-width:130px}}
  </style>
</head>
<body><main class="wrap">
  <section id="login" class="panel login"><h1>评论管理</h1><p class="muted">登录以管理博客评论。</p><form id="login-form"><input name="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>登录</button><div class="error" id="login-error"></div></form></section>
  <section id="dashboard" class="panel hidden"><div class="row"><div><h1>评论管理</h1><div id="count" class="muted small"></div></div><button id="logout" class="secondary">退出登录</button></div><div id="message" class="muted"></div><table><thead><tr><th>昵称 / 时间</th><th>页面</th><th>评论</th><th></th></tr></thead><tbody id="comments"></tbody></table><div class="row"><span id="page-label" class="muted small"></span><div><button id="prev" class="secondary">上一页</button> <button id="next" class="secondary">下一页</button></div></div></section>
</main><script>
const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),tbody=document.querySelector('#comments'),message=document.querySelector('#message');let page=0,total=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const res=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json();if(!res.ok)throw Object.assign(new Error(data.error||'请求失败'),{status:res.status});return data}
function showLogin(){dashboard.classList.add('hidden');login.classList.remove('hidden')}
function showDashboard(){login.classList.add('hidden');dashboard.classList.remove('hidden')}
async function load(){try{const data=await request(`/api/admin/comments?page=${page}`);total=data.total;document.querySelector('#count').textContent=`共 ${total} 条评论`;document.querySelector('#page-label').textContent=`第 ${page+1} 页`;tbody.innerHTML=data.comments.map(c=>`<tr><td><strong>${esc(c.nickname)}</strong><div class="muted small">${new Date(c.created_at).toLocaleString()}</div></td><td class="path">${esc(c.path)}</td><td class="content">${esc(c.content)}</td><td><button class="danger" data-delete="${c.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无评论</td></tr>';document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*100>=total;showDashboard()}catch(e){if(e.status===401)showLogin();else message.textContent=e.message}}
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const password=new FormData(e.currentTarget).get('password');try{await request('/api/admin/login',{method:'POST',body:JSON.stringify({password})});e.currentTarget.reset();document.querySelector('#login-error').textContent='';page=0;await load()}catch(err){document.querySelector('#login-error').textContent=err.message}});
tbody.addEventListener('click',async e=>{const id=e.target.dataset.delete;if(!id)return;if(!confirm('确定删除这条评论吗？'))return;try{await request(`/api/admin/comments/${id}`,{method:'DELETE'});await load()}catch(err){message.textContent=err.message}});
document.querySelector('#logout').onclick=async()=>{await request('/api/admin/logout',{method:'POST'});showLogin()};document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);load()};document.querySelector('#next').onclick=()=>{page++;load()};load();
</script></body></html>
