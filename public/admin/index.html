<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>评论管理 · Cloudflare Hexo Comments</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#253047;background:#f3f5fa}*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:radial-gradient(ellipse at 12% 0%,rgba(113,142,255,.13),transparent 42%),radial-gradient(ellipse at 90% 30%,rgba(145,191,255,.12),transparent 38%),#f3f5fa}.wrap{max-width:1080px;margin:auto}.panel{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.82);border-radius:15px;padding:24px;box-shadow:0 18px 55px rgba(37,54,88,.09),inset 0 1px rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}h1{font-size:1.45rem;letter-spacing:-.025em;margin:0 0 6px}.muted{color:#7b879a}.login{max-width:410px;margin:8vh auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.login form{display:grid;gap:12px;margin-top:20px}input{width:100%;padding:12px;border:1px solid #dce2ec;border-radius:7px;background:rgba(255,255,255,.8);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}input:focus{border-color:#6280ef;box-shadow:0 0 0 3px rgba(98,128,239,.13)}button{border:0;border-radius:6px;padding:10px 15px;background:#5875e7;color:white;font:inherit;font-weight:600;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s;box-shadow:0 3px 9px rgba(74,101,210,.16)}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 14px rgba(74,101,210,.22)}button:active:not(:disabled){transform:scale(.98)}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:rgba(238,241,247,.9);color:#364259;box-shadow:none}button.danger{background:#fff0f0;color:#bd3e47;padding:7px 10px;box-shadow:none}.error{color:#bd3434;min-height:1.4em}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid rgba(220,226,236,.8);vertical-align:top}th{font-size:.84rem;color:#78849a}td.content{white-space:pre-wrap;overflow-wrap:anywhere;min-width:220px}.path{max-width:210px;overflow-wrap:anywhere;color:#59677e;font-size:.88rem}.small{font-size:.82rem}.website{display:inline-block;margin-top:5px;color:#5575ed;text-decoration:none;overflow-wrap:anywhere}.website:hover{text-decoration:underline}.hidden{display:none}.table-wrap{overflow-x:auto;border:1px solid rgba(220,226,236,.72);border-radius:9px;background:rgba(255,255,255,.38)}@media(max-width:700px){body{padding:18px 10px}.panel{padding:17px;overflow:hidden}.table-wrap{overflow-x:auto}table{min-width:680px}th,td{padding:10px 7px}.path{max-width:130px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="wrap">
  <section id="login" class="panel login"><h1>评论管理</h1><p class="muted">登录以管理博客评论。</p><form id="login-form"><input name="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>登录</button><div class="error" id="login-error"></div></form></section>
  <section id="dashboard" class="panel hidden"><div class="row"><div><h1>评论管理</h1><div id="count" class="muted small"></div></div><button id="logout" class="secondary">退出登录</button></div><div id="message" class="muted"></div><div class="table-wrap"><table><thead><tr><th>昵称 / 时间</th><th>页面</th><th>评论</th><th></th></tr></thead><tbody id="comments"></tbody></table></div><div class="row"><span id="page-label" class="muted small"></span><div><button id="prev" class="secondary">上一页</button> <button id="next" class="secondary">下一页</button></div></div></section>
</main><script>
const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),tbody=document.querySelector('#comments'),message=document.querySelector('#message');let page=0,total=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=value=>{try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
async function request(path,options={}){const res=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json();if(!res.ok)throw Object.assign(new Error(data.error||'请求失败'),{status:res.status});return data}
function showLogin(){dashboard.classList.add('hidden');login.classList.remove('hidden')}
function showDashboard(){login.classList.add('hidden');dashboard.classList.remove('hidden')}
async function load(){try{const data=await request(`/api/admin/comments?page=${page}`);total=data.total;document.querySelector('#count').textContent=`共 ${total} 条评论`;document.querySelector('#page-label').textContent=`第 ${page+1} 页`;tbody.innerHTML=data.comments.map(c=>{const website=safeUrl(c.website||'');return `<tr><td><strong>${esc(c.nickname)}</strong>${website?`<div><a class="website small" href="${esc(website)}" target="_blank" rel="noopener noreferrer nofollow">${esc(c.website)} ↗</a></div>`:''}<div class="muted small">${new Date(c.created_at).toLocaleString()}</div></td><td class="path">${esc(c.path)}</td><td class="content">${esc(c.content)}</td><td><button class="danger" data-delete="${c.id}">删除</button></td></tr>`}).join('')||'<tr><td colspan="4" class="muted">暂无评论</td></tr>';document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*100>=total;showDashboard()}catch(e){if(e.status===401)showLogin();else message.textContent=e.message}}
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const password=new FormData(e.currentTarget).get('password');try{await request('/api/admin/login',{method:'POST',body:JSON.stringify({password})});e.currentTarget.reset();document.querySelector('#login-error').textContent='';page=0;await load()}catch(err){document.querySelector('#login-error').textContent=err.message}});
tbody.addEventListener('click',async e=>{const id=e.target.dataset.delete;if(!id)return;if(!confirm('确定删除这条评论吗？'))return;try{await request(`/api/admin/comments/${id}`,{method:'DELETE'});await load()}catch(err){message.textContent=err.message}});
document.querySelector('#logout').onclick=async()=>{await request('/api/admin/logout',{method:'POST'});showLogin()};document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);load()};document.querySelector('#next').onclick=()=>{page++;load()};load();
</script></body></html>
